<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flask CRUD Dashboard</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #333;
    }

    /* Header */

    .header {
        background: #1f4e79;
        color: white;
        padding: 22px 40px;
    }

    .header h1 {
        margin: 0;
        font-size: 28px;
    }

    .header p {
        margin: 6px 0 0;
        opacity: 0.9;
    }

    /* Main container */

    .container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 20px;
    }

    /* Dashboard cards */

    .stats {
        display: flex;
        gap: 20px;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        flex: 1;
    }

    .card h3 {
        margin: 0 0 8px;
        color: #666;
    }

    .total {
        font-size: 30px;
        font-weight: bold;
        color: #1f4e79;
    }

    /* Sections */

    .section {
        background: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 25px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .section h2 {
        margin-top: 0;
    }

    /* Form */

    .form-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    input {
        flex: 1;
        min-width: 200px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #1f4e79;
    }

    /* Buttons */

    button {
        border: none;
        padding: 11px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    .add-btn {
        background: #1f4e79;
        color: white;
    }

    .add-btn:hover {
        background: #163a5c;
    }

    .update-btn {
        background: #198754;
        color: white;
    }

    .update-btn:hover {
        background: #146c43;
    }

    .cancel-btn {
        background: #6c757d;
        color: white;
    }

    .refresh-btn {
        background: #e8eef5;
        color: #1f4e79;
        margin-bottom: 15px;
    }

    .edit-btn {
        background: #ffc107;
        color: #212529;
        margin-right: 5px;
        padding: 7px 12px;
    }

    .delete-btn {
        background: #dc3545;
        color: white;
        padding: 7px 12px;
    }

    .delete-btn:hover {
        background: #b02a37;
    }

    /* Message */

    .message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 6px;
        display: none;
    }

    /* Table */

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th,
    td {
        padding: 14px;
        border-bottom: 1px solid #eee;
        text-align: left;
    }

    th {
        background: #f1f4f8;
        color: #333;
    }

    tr:hover {
        background: #f8fafc;
    }

    .empty {
        text-align: center;
        color: #777;
        padding: 25px;
    }

    /* Edit mode */

    #editButtons {
        display: none;
    }

    /* Mobile */

    @media (max-width: 700px) {

        .stats {
            flex-direction: column;
        }

        .form-row {
            flex-direction: column;
        }

        input {
            width: 100%;
        }

        table {
            font-size: 13px;
        }

        th,
        td {
            padding: 8px;
        }

        .header {
            padding: 20px;
        }

    }

</style>
```

</head>

<body>

```
<!-- Header -->

<div class="header">

    <h1>Flask CRUD Dashboard</h1>

    <p>User Management System</p>

</div>


<div class="container">


    <!-- Dashboard -->

    <div class="stats">

        <div class="card">

            <h3>Total Users</h3>

            <div
                class="total"
                id="totalUsers">
                0
            </div>

        </div>


        <div class="card">

            <h3>Backend</h3>

            <div>
                Flask REST API
            </div>

        </div>


        <div class="card">

            <h3>Database</h3>

            <div>
                PostgreSQL
            </div>

        </div>

    </div>


    <!-- Add / Edit User -->

    <div class="section">

        <h2 id="formTitle">
            ➕ Add New User
        </h2>


        <div class="form-row">


            <input
                type="text"
                id="name"
                placeholder="Enter name">


            <input
                type="email"
                id="email"
                placeholder="Enter email">


            <button
                id="addButton"
                class="add-btn"
                onclick="addUser()">

                Add User

            </button>


            <div id="editButtons">

                <button
                    class="update-btn"
                    onclick="updateUser()">

                    Update User

                </button>


                <button
                    class="cancel-btn"
                    onclick="cancelEdit()">

                    Cancel

                </button>

            </div>


        </div>


        <div
            id="message"
            class="message">
        </div>

    </div>


    <!-- Users -->

    <div class="section">


        <h2>👥 Users</h2>


        <button
            class="refresh-btn"
            onclick="loadUsers()">

            🔄 Refresh Users

        </button>


        <table>


            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="userTable">

            </tbody>


        </table>


    </div>


</div>
```

<script>


/* Current user being edited */

let editingUserId = null;



/* Load Users */

async function loadUsers() {


    try {


        const response =
            await fetch("/users");


        const users =
            await response.json();


        const table =
            document.getElementById("userTable");


        const totalUsers =
            document.getElementById("totalUsers");


        table.innerHTML = "";


        totalUsers.textContent =
            users.length;


        if (users.length === 0) {


            table.innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="empty">

                        No users found

                    </td>

                </tr>

            `;


            return;

        }


        users.forEach(user => {


            table.innerHTML += `

                <tr>

                    <td>
                        ${user.id}
                    </td>


                    <td>
                        ${user.name}
                    </td>


                    <td>
                        ${user.email}
                    </td>


                    <td>


                        <button

                            class="edit-btn"

                            onclick="editUser(
                                ${user.id},
                                '${user.name}',
                                '${user.email}'
                            )">

                            ✏️ Edit

                        </button>


                        <button

                            class="delete-btn"

                            onclick="deleteUser(
                                ${user.id}
                            )">

                            🗑️ Delete

                        </button>


                    </td>

                </tr>

            `;

        });


    }

    catch (error) {


        showMessage(
            "Unable to load users",
            "error"
        );


    }

}



/* Add User */

async function addUser() {


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    if (!name || !email) {


        showMessage(
            "Please enter both name and email",
            "error"
        );


        return;

    }


    try {


        const response =
            await fetch(
                "/users",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            name: name,

                            email: email

                        })

                }
            );


        if (!response.ok) {


            showMessage(
                "Failed to create user",
                "error"
            );


            return;

        }


        clearForm();


        showMessage(
            "User added successfully!",
            "success"
        );


        loadUsers();


    }

    catch (error) {


        showMessage(
            "Something went wrong",
            "error"
        );


    }

}



/* Edit User */

function editUser(id, name, email) {


    editingUserId = id;


    document
        .getElementById("name")
        .value = name;


    document
        .getElementById("email")
        .value = email;


    document
        .getElementById("formTitle")
        .textContent =
        "✏️ Edit User";


    document
        .getElementById("addButton")
        .style.display = "none";


    document
        .getElementById("editButtons")
        .style.display = "flex";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* Update User */

async function updateUser() {


    if (editingUserId === null) {

        return;

    }


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    if (!name || !email) {


        showMessage(
            "Please enter both name and email",
            "error"
        );


        return;

    }


    try {


        const response =
            await fetch(
                `/users/${editingUserId}`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            name: name,

                            email: email

                        })

                }
            );


        if (!response.ok) {


            showMessage(
                "Failed to update user",
                "error"
            );


            return;

        }


        showMessage(
            "User updated successfully!",
            "success"
        );


        cancelEdit();


        loadUsers();


    }

    catch (error) {


        showMessage(
            "Something went wrong",
            "error"
        );


    }

}



/* Cancel Edit */

function cancelEdit() {


    editingUserId = null;


    clearForm();


    document
        .getElementById("formTitle")
        .textContent =
        "➕ Add New User";


    document
        .getElementById("addButton")
        .style.display = "inline-block";


    document
        .getElementById("editButtons")
        .style.display = "none";

}



/* Delete User */

async function deleteUser(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this user?"
        );


    if (!confirmDelete) {

        return;

    }


    try {


        const response =
            await fetch(
                `/users/${id}`,
                {

                    method: "DELETE"

                }
            );


        if (response.ok) {


            showMessage(
                "User deleted successfully!",
                "success"
            );


            loadUsers();


        }

        else {


            showMessage(
                "Failed to delete user",
                "error"
            );

        }


    }

    catch (error) {


        showMessage(
            "Something went wrong",
            "error"
        );

    }

}



/* Clear Form */

function clearForm() {


    document
        .getElementById("name")
        .value = "";


    document
        .getElementById("email")
        .value = "";

}



/* Show Message */

function showMessage(text, type) {


    const message =
        document.getElementById("message");


    message.textContent = text;


    message.style.display =
        "block";


    if (type === "success") {


        message.style.background =
            "#d4edda";


        message.style.color =
            "#155724";

    }

    else {


        message.style.background =
            "#f8d7da";


        message.style.color =
            "#721c24";

    }


    setTimeout(() => {


        message.style.display =
            "none";


    }, 3000);

}



/* Load users when page opens */

loadUsers();


</script>

</body>

</html>
